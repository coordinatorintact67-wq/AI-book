<svg width="600" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="200" fill="#f0f0f0" />
  <text x="50%" y="50%" font-family="Arial" font-size="24" fill="#333" text-anchor="middle" dominant-baseline="middle">
    Course Roadmap Visual Placeholder
  </text>
  <rect x="20" y="70" width="100" height="60" rx="10" ry="10" fill="#4a5568" />
  <text x="70" y="100" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="middle">Module 1</text>
  <rect x="150" y="70" width="100" height="60" rx="10" ry="10" fill="#4a5568" />
  <text x="200" y="100" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="middle">Module 2</text>
  <rect x="280" y="70" width="100" height="60" rx="10" ry="10" fill="#4a5568" />
  <text x="330" y="100" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="middle">Module 3</text>
  <rect x="410" y="70" width="100" height="60" rx="10" ry="10" fill="#4a5568" />
  <text x="460" y="100" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="middle">Module 4</text>
  <line x1="120" y1="100" x2="150" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="100" x2="280" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="100" x2="410" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
    refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568" />
    </marker>
  </defs>
</svg>
